<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exclusive Content</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
    const SUPABASE_URL = "https://hgqrtjuccspzwagntnxj.supabase.co";

    const SUPABASE_KEY = "sb_publishable_nLNI7mX50vhJZfz6xf9JaQ_HKw2usMf";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
    </script>
    <style>
    body {
    margin: 0;
    padding: 20px;
    background-color: #08080d;
    color: #ffffff;
    font-family: Arial, sans-serif;
    position: relative;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: -1;
    opacity: 0.12;

    background-image:
        radial-gradient(circle at 15% 20%, #ff4fa3 1px, transparent 2px),
        radial-gradient(circle at 80% 15%, #a855f7 1px, transparent 2px),
        radial-gradient(circle at 35% 65%, #ff4fa3 1px, transparent 2px),
        radial-gradient(circle at 90% 75%, #a855f7 1px, transparent 2px),
        radial-gradient(circle at 60% 40%, #ff4fa3 1px, transparent 2px);

    background-size:
        140px 140px,
        180px 180px,
        160px 160px,
        200px 200px,
        220px 220px;
}

    h1 {
        margin-bottom: 20px;
    }

    #back-button {
        background: transparent;
        border: none;
        color: #ff4fa3;
        font-size: 16px;
        padding: 0;
        margin-bottom: 20px;
        cursor: pointer;
    }

    #creator-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 25px;
    }

    #creator-avatar {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    overflow: hidden;
    background: #191923;
    border: 1px solid #292936;
    box-shadow: 0 0 10px rgba(168, 85, 247, 0.25);
    flex-shrink: 0;
}

    #creator-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .creator-header-info strong {
    font-size: 19px;
    color: #ffffff;
    font-weight: 600;
    }
    .creator-header-info strong {
        font-size: 18px;
        color: #ffffff;
    }

    .creator-header-info span {
        font-size: 13px;
        color: #ff4fa3;
    }

  #exclusive-content {
    display: grid;
    gap: 20px;
  }

    #exclusive-content div {
    background: #121218;
    padding: 10px;
    border-radius: 18px;
    border: 1px solid #292936;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.35);
            }

    #exclusive-content h3 {
        margin-top: 0;
        color: #ffffff;
    }

    #exclusive-content img {
    width: 100%;
    display: block;
    border-radius: 14px;
    box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
}
    </style>
</head>

<body>
<button id="back-button">← Back</button>
    <div id="creator-header">
    <div id="creator-avatar"></div>

    <div class="creator-header-info">
        <strong id="creator-name">Exclusive Content</strong>
        <span>Exclusive content</span>
    </div>
    </div>

    <div id="exclusive-content">
    Loading...
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const creatorId = params.get("creator");
async function loadCreatorName() {
    const { data, error } = await supabaseClient
        .from("creators")
        .select("name, photo_url")
        .eq("id", creatorId)
        .single();

    if (error) {
        console.error("Creator name error:", error);
        return;
    }

    if (data) {
    document.getElementById("creator-name").textContent =
        data.name || "Exclusive Content";

    if (data.photo_url) {
        document.getElementById("creator-avatar").innerHTML = `
            <img
                src="${data.photo_url}"
                alt="${data.name || "Creator"}"
            >
        `;
    }
    }
}

loadCreatorName();
    async function loadExclusiveContent() {

        if (!creatorId) {
            document.getElementById("exclusive-content").innerHTML =
                "No creator specified.";
            return;
        }

        const { data, error } = await supabaseClient
            .from("exclusive_content")
            .select("*")
            .eq("creator_id", creatorId)
            .order("created_at", { ascending: false });

        if (error) {
            console.error("Exclusive content error:", error);

            document.getElementById("exclusive-content").innerHTML =
                "Unable to load exclusive content.";

            return;
        }

        if (!data || data.length === 0) {
            document.getElementById("exclusive-content").innerHTML =
                "No exclusive content yet.";
            return;
        }

        document.getElementById("exclusive-content").innerHTML =
            data.map(item => `
                <div>
                    <h3>${item.title || "Exclusive Content"}</h3>
                    <img
                        src="${item.media_url}"
                        alt="${item.title || "Exclusive content"}"
                        style="max-width:100%;"
                    >
                </div>
            `).join("");
    }

    loadExclusiveContent();
    document.getElementById("back-button").addEventListener("click", () => {
    window.history.back();
});
</script>
</body>
</html>
