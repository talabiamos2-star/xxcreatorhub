<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exclusive Content</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
    const SUPABASE_URL = "https://hgqrtjuccspzwagntnxj.supabase.co";

    const SUPABASE_KEY = "sb_publishable_nLNI7mX50vhJZfz6xf9JaQ_HKw2usMf";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
    </script>
    <style>
    body {
        margin: 0;
        padding: 20px;
        background: #0f0f12;
        color: #ffffff;
        font-family: Arial, sans-serif;
    }

    h1 {
        margin-bottom: 20px;
    }

    #exclusive-content {
        display: grid;
        gap: 20px;
    }

    #exclusive-content div {
        background: #1a1a1f;
        padding: 15px;
        border-radius: 16px;
    }

    #exclusive-content h3 {
        margin-top: 0;
    }

    #exclusive-content img {
        width: 100%;
        display: block;
        border-radius: 12px;
    }

    #creator-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
    }

    #creator-avatar {
        width: 50px;
        height: 50px;
        border-radius: 50%;
        overflow: hidden;
        background: #333;
        flex-shrink: 0;
    }

    #creator-avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .creator-header-info {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .creator-header-info strong {
        font-size: 18px;
    }

    .creator-header-info span {
        font-size: 13px;
        color: #999;
    }
        #back-button {
    background: transparent;
    border: none;
    color: #ffffff;
    font-size: 16px;
    padding: 0;
    margin-bottom: 20px;
    cursor: pointer;
        }
    </style>
</head>

<body>
<button id="back-button">← Back</button>
    <div id="creator-header">
    <div id="creator-avatar"></div>

    <div class="creator-header-info">
        <strong id="creator-name">Exclusive Content</strong>
        <span>Exclusive content</span>
    </div>
    </div>

    <div id="exclusive-content">
    Loading...
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const creatorId = params.get("creator");
async function loadCreatorName() {
    const { data, error } = await supabaseClient
        .from("creators")
        .select("name, photo_url")
        .eq("id", creatorId)
        .single();

    if (error) {
        console.error("Creator name error:", error);
        return;
    }

    if (data) {
    document.getElementById("creator-name").textContent =
        data.name || "Exclusive Content";

    if (data.photo_url) {
        document.getElementById("creator-avatar").innerHTML = `
            <img
                src="${data.photo_url}"
                alt="${data.name || "Creator"}"
            >
        `;
    }
    }
}

loadCreatorName();
    async function loadExclusiveContent() {

        if (!creatorId) {
            document.getElementById("exclusive-content").innerHTML =
                "No creator specified.";
            return;
        }

        const { data, error } = await supabaseClient
            .from("exclusive_content")
            .select("*")
            .eq("creator_id", creatorId)
            .order("created_at", { ascending: false });

        if (error) {
            console.error("Exclusive content error:", error);

            document.getElementById("exclusive-content").innerHTML =
                "Unable to load exclusive content.";

            return;
        }

        if (!data || data.length === 0) {
            document.getElementById("exclusive-content").innerHTML =
                "No exclusive content yet.";
            return;
        }

        document.getElementById("exclusive-content").innerHTML =
            data.map(item => `
                <div>
                    <h3>${item.title || "Exclusive Content"}</h3>
                    <img
                        src="${item.media_url}"
                        alt="${item.title || "Exclusive content"}"
                        style="max-width:100%;"
                    >
                </div>
            `).join("");
    }

    loadExclusiveContent();
    document.getElementById("back-button").addEventListener("click", () => {
    window.history.back();
});
</script>
</body>
</html>
