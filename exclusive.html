<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Exclusive Content</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
    const SUPABASE_URL = "https://hgqrtjuccspzwagntnxj.supabase.co";

    const SUPABASE_KEY = "sb_publishable_nLNI7mX50vhJZfz6xf9JaQ_HKw2usMf";

    const supabaseClient = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );
    </script>
</head>

<body>

    <h1>Exclusive Content</h1>

    <div id="exclusive-content">
    Loading...
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const creatorId = params.get("creator");

    async function loadExclusiveContent() {

        if (!creatorId) {
            document.getElementById("exclusive-content").innerHTML =
                "No creator specified.";
            return;
        }

        const { data, error } = await supabaseClient
            .from("exclusive_content")
            .select("*")
            .eq("creator_id", creatorId)
            .order("created_at", { ascending: false });

        if (error) {
            console.error("Exclusive content error:", error);

            document.getElementById("exclusive-content").innerHTML =
                "Unable to load exclusive content.";

            return;
        }

        if (!data || data.length === 0) {
            document.getElementById("exclusive-content").innerHTML =
                "No exclusive content yet.";
            return;
        }

        document.getElementById("exclusive-content").innerHTML =
            data.map(item => `
                <div>
                    <h3>${item.title || "Exclusive Content"}</h3>
                    <img
                        src="${item.media_url}"
                        alt="${item.title || "Exclusive content"}"
                        style="max-width:100%;"
                    >
                </div>
            `).join("");
    }

    loadExclusiveContent();
</script>
</body>
</html>
