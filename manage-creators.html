<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Creators</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <h1>Manage Creators</h1>
<button id="add-creator-button">
    + Add Creator
</button>
    <div id="creator-list">
        Loading creators...
    </div>
<div id="add-creator-form"
     style="display:none;"
     data-editing-id="">

    <input
        type="text"
        id="creator-name"
        placeholder="Creator name"
    >

    <input
        type="text"
        id="creator-username"
        placeholder="Username"
    >

    <input
        type="text"
        id="creator-photo"
        placeholder="Photo URL"
    >

    <textarea
        id="creator-bio"
        placeholder="Bio"
    ></textarea>

    <button id="save-creator-button">
        Save Creator
    </button>

</div>
<script>

const SUPABASE_URL =
    "https://hgqrtjuccspzwagntnxj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_nLNI7mX50vhJZfz6xf9JaQ_HKw2usMf";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadCreators() {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("*");
            

    if (error) {

        console.error(error);

        document.getElementById("creator-list").textContent =
    "Failed to load creators: " + error.message;

        return;
    }

    const list =
        document.getElementById("creator-list");

    if (!data || data.length === 0) {

        list.textContent =
            "No creators yet.";

        return;
    }

    list.innerHTML =
    data.map(creator => `
        <div>
            <h3>${creator.name}</h3>
            <p>@${creator.username}</p>

            <button onclick="editCreator(${creator.id})">
                Edit
            </button>
        </div>
    `).join("");
}


document.getElementById("add-creator-button")

        document.getElementById("add-creator-form")
            .style.display = "block";

    });

document.getElementById("save-creator-button")
    .addEventListener("click", async function () {

        const name =
            document.getElementById("creator-name").value;

        const username =
            document.getElementById("creator-username").value;

        const photo_url =
            document.getElementById("creator-photo").value;

        const bio =
            document.getElementById("creator-bio").value;


        if (!name || !username || !photo_url) {

            alert("Please fill in name, username and photo URL.");

            return;
        }


        const { error } =
            await supabaseClient
                .from("creators")
                .insert({
                    name: name,
                    username: username,
                    photo_url: photo_url,
                    bio: bio
                });


        if (error) {

            console.error(error);

            alert("Failed to save creator: " + error.message);

            return;
        }


        alert("Creator added successfully!");


        document.getElementById("creator-name").value = "";
        document.getElementById("creator-username").value = "";
        document.getElementById("creator-photo").value = "";
        document.getElementById("creator-bio").value = "";

        document.getElementById("add-creator-form")
            .style.display = "none";


        loadCreators();

    });
    async function editCreator(id) {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("*")
            .eq("id", id)
            .single();

    if (error) {
        alert("Failed to load creator: " + error.message);
        return;
    }

    document.getElementById("creator-name").value =
        data.name || "";

    document.getElementById("creator-username").value =
        data.username || "";

    document.getElementById("creator-photo").value =
        data.photo_url || "";

    document.getElementById("creator-bio").value =
        data.bio || "";

    document.getElementById("add-creator-form")
        .style.display = "block";
    }
loadCreators();

</script>

</body>

</html>
