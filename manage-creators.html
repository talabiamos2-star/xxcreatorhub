<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Creators</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: #08080d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .admin-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 24px 18px 40px;
        }

        /* ---------- HEADER ---------- */

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 27px;
            font-weight: 700;
        }

        .page-header p {
            margin: 7px 0 0;
            color: #8f8f9d;
            font-size: 13px;
        }

        /* ---------- ADD BUTTON ---------- */

        .add-creator-button {
            width: 100%;
            border: none;
            border-radius: 15px;
            padding: 15px;
            background: linear-gradient(
                135deg,
                #ff3f9f,
                #8b4dff
            );
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 18px;
        }

        .add-creator-button:active {
            transform: scale(0.98);
        }

        /* ---------- STATS ---------- */

        .creator-summary {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 17px;
            padding: 17px;
            margin-bottom: 15px;
        }

        .summary-label {
            color: #8f8f9d;
            font-size: 12px;
            margin-bottom: 7px;
        }

        #creator-count {
            margin: 0;
            font-size: 23px;
            font-weight: 700;
        }

        /* ---------- SEE ALL ---------- */

        .toggle-creators-button {
            width: 100%;
            background: #15151d;
            border: 1px solid #292936;
            color: #ffffff;
            border-radius: 14px;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 15px;
        }

        /* ---------- CREATOR LIST ---------- */

        #creator-list {
            margin-bottom: 18px;
        }

        .creator-card {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 16px;
            margin-bottom: 12px;
        }

        .creator-card-top {
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .creator-avatar {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            background: linear-gradient(
                135deg,
                #ff3f9f,
                #8b4dff
            );
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            flex-shrink: 0;
        }

        .creator-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .creator-avatar-letter {
            font-size: 21px;
            font-weight: 700;
        }

        .creator-info {
            min-width: 0;
            flex: 1;
        }

        .creator-info h3 {
            margin: 0 0 5px;
            font-size: 16px;
        }

        .creator-info p {
            margin: 0;
            color: #9999a7;
            font-size: 13px;
        }

        .creator-actions {
            display: flex;
            gap: 8px;
            margin-top: 15px;
        }

        .edit-button,
        .delete-button {
            flex: 1;
            border: none;
            border-radius: 11px;
            padding: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .edit-button {
            background: #242431;
            color: #ffffff;
        }

        .delete-button {
            background: #2a151d;
            color: #ff6b91;
        }

        /* ---------- FORM ---------- */

        #add-creator-form {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 20px;
            padding: 18px;
            margin-top: 18px;
        }

        .form-header {
            margin-bottom: 17px;
        }

        .form-header h2 {
            margin: 0 0 5px;
            font-size: 18px;
        }

        .form-header p {
            margin: 0;
            color: #8f8f9d;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 13px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            color: #b7b7c3;
            font-size: 12px;
        }

        input[type="text"],
        textarea {
            width: 100%;
            background: #0b0b11;
            border: 1px solid #2c2c38;
            border-radius: 12px;
            color: #ffffff;
            padding: 13px;
            font-size: 14px;
            outline: none;
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: #8b4dff;
        }

        textarea {
            min-height: 100px;
            resize: vertical;
        }

        /* ---------- FILE INPUT ---------- */

        .file-box {
            background: #0b0b11;
            border: 1px dashed #3a3a49;
            border-radius: 13px;
            padding: 13px;
        }

        input[type="file"] {
            width: 100%;
            color: #aaaab5;
            font-size: 12px;
        }

        input[type="file"]::file-selector-button {
            border: none;
            border-radius: 9px;
            padding: 9px 12px;
            margin-right: 10px;
            background: #242431;
            color: #ffffff;
            cursor: pointer;
        }

        /* ---------- SAVE BUTTON ---------- */

        #save-creator-button {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 14px;
            background: linear-gradient(
                135deg,
                #ff3f9f,
                #8b4dff
            );
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }

        #save-creator-button:active {
            transform: scale(0.98);
        }

        /* ---------- EMPTY / ERROR ---------- */

        .empty-message {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            color: #888895;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="admin-container">

    <div class="page-header">

        <h1>Manage Creators</h1>

        <p>Add, edit and manage your CreatorHub creators.</p>

    </div>


    <button
        id="add-creator-button"
        class="add-creator-button"
    >
        + Add Creator
    </button>


    <div class="creator-summary">

        <div class="summary-label">
            Total Creators
        </div>

        <p id="creator-count">
            Loading creators...
        </p>

    </div>


    <button
        id="toggle-creators-button"
        class="toggle-creators-button"
    >
        See all creators ▼
    </button>


    <div
        id="creator-list"
        style="display:none;"
    >
        Loading creators...
    </div>


    <div
        id="add-creator-form"
        style="display:none;"
        data-editing-id=""
    >

        <div class="form-header">

            <h2>Add Creator</h2>

            <p>
                Enter the creator information below.
            </p>

        </div>


        <div class="form-group">

            <label class="form-label">
                Creator Name
            </label>

            <input
                type="text"
                id="creator-name"
                placeholder="Creator name"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                Username
            </label>

            <input
                type="text"
                id="creator-username"
                placeholder="Username"
            >

        </div>


        <div class="form-group">

            <label class="form-label">
                Profile Photo
            </label>

            <div class="file-box">

                <input
                    type="file"
                    id="creator-photo"
                    accept="image/*"
                >

            </div>

        </div>


        <div class="form-group">

            <label class="form-label">
                Bio
            </label>

            <textarea
                id="creator-bio"
                placeholder="Creator bio"
            ></textarea>

        </div>


        <button id="save-creator-button">
            Save Creator
        </button>

    </div>

</div>


<script>

const SUPABASE_URL =
    "https://hgqrtjuccspzwagntnxj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_nLNI7mX50vhJZfz6xf9JaQ_HKw2usMf";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ---------- LOAD CREATORS ----------

async function loadCreators() {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("*");

    if (error) {

        console.error(error);

        document.getElementById("creator-count").textContent =
            "Failed to load creators.";

        document.getElementById("creator-list").innerHTML =
            `<div class="empty-message">
                Error: ${error.message}
            </div>`;

        return;
    }

    const list =
        document.getElementById("creator-list");

    if (!data || data.length === 0) {

        document.getElementById("creator-count").textContent =
            "0 creators";

        list.innerHTML =
            `<div class="empty-message">
                No creators yet.
            </div>`;

        return;
    }

    document.getElementById("creator-count").textContent =
        data.length +
        (data.length === 1
            ? " creator"
            : " creators");


    list.innerHTML =
        data.map(creator => {

            const avatar =
                creator.photo_url
                    ? `<img
                            src="${creator.photo_url}"
                            alt="${creator.name}"
                       >`
                    : `<span class="creator-avatar-letter">
                            ${creator.name
                                ? creator.name.charAt(0).toUpperCase()
                                : "?"}
                       </span>`;

            return `

                <div class="creator-card">

                    <div class="creator-card-top">

                        <div class="creator-avatar">

                            ${avatar}

                        </div>

                        <div class="creator-info">

                            <h3>
                                ${creator.name}
                            </h3>

                            <p>
                                @${creator.username}
                            </p>

                        </div>

                    </div>


                    <div class="creator-actions">

                        <button
                            class="edit-button"
                            onclick="editCreator(${creator.id})"
                        >
                            Edit
                        </button>

                        <button
                            class="delete-button"
                            onclick="deleteCreator(${creator.id})"
                        >
                            Delete
                        </button>

                    </div>

                </div>

            `;

        }).join("");
}


// ---------- ADD CREATOR BUTTON ----------

document.getElementById("add-creator-button")
    .addEventListener("click", function () {

        document.getElementById("add-creator-form")
            .setAttribute("data-editing-id", "");

        document.getElementById("add-creator-form")
            .style.display = "block";

        document.querySelector("#add-creator-form h2")
            .textContent = "Add Creator";

        document.querySelector("#add-creator-form p")
            .textContent =
            "Enter the creator information below.";

        window.scrollTo({
            top: document.getElementById("add-creator-form").offsetTop,
            behavior: "smooth"
        });

    });


// ---------- SAVE CREATOR ----------

document.getElementById("save-creator-button")
    .addEventListener("click", async function () {

        const name =
            document.getElementById("creator-name").value;

        const username =
            document.getElementById("creator-username").value;

        const photoFile =
            document.getElementById("creator-photo").files[0];

        const bio =
            document.getElementById("creator-bio").value;


        if (!name || !username) {

            alert(
                "Please fill in name and username."
            );

            return;
        }


        const form =
            document.getElementById("add-creator-form");

        const editingId =
            form.getAttribute("data-editing-id");


        let error;

        let photo_url = null;


        // ---------- KEEP EXISTING PHOTO WHEN EDITING ----------

        if (editingId) {

            const { data: existingCreator } =
                await supabaseClient
                    .from("creators")
                    .select("photo_url")
                    .eq("id", editingId)
                    .single();

            if (existingCreator) {

                photo_url =
                    existingCreator.photo_url;

            }

        }


        // ---------- UPLOAD NEW PHOTO ----------

        if (photoFile) {

            const fileName =
                Date.now() +
                "_creator_" +
                photoFile.name;


            const { error: uploadError } =
                await supabaseClient
                    .storage
                    .from("images")
                    .upload(
                        fileName,
                        photoFile
                    );


            if (uploadError) {

                console.error(uploadError);

                alert(
                    "Failed to upload profile photo: " +
                    uploadError.message
                );

                return;
            }


            const { data: publicData } =
                supabaseClient
                    .storage
                    .from("images")
                    .getPublicUrl(fileName);


            photo_url =
                publicData.publicUrl;

        }


        // ---------- UPDATE CREATOR ----------

        if (editingId) {

            const result =
                await supabaseClient
                    .from("creators")
                    .update({
                        name: name,
                        username: username,
                        photo_url: photo_url,
                        bio: bio
                    })
                    .eq("id", editingId);

            error =
                result.error;

        }

        // ---------- ADD NEW CREATOR ----------

        else {

            const result =
                await supabaseClient
                    .from("creators")
                    .insert({
                        name: name,
                        username: username,
                        photo_url: photo_url,
                        bio: bio
                    });

            error =
                result.error;

        }


        if (error) {

            console.error(error);

            alert(
                "Failed to save creator: " +
                error.message
            );

            return;
        }


        alert(
            editingId
                ? "Creator updated successfully!"
                : "Creator added successfully!"
        );


        document.getElementById("creator-name").value = "";

        document.getElementById("creator-username").value = "";

        document.getElementById("creator-photo").value = "";

        document.getElementById("creator-bio").value = "";


        form.style.display = "none";

        form.setAttribute(
            "data-editing-id",
            ""
        );


        loadCreators();

    });


// ---------- EDIT CREATOR ----------

async function editCreator(id) {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("*")
            .eq("id", id)
            .single();


    if (error) {

        alert(
            "Failed to load creator: " +
            error.message
        );

        return;
    }


    document.getElementById("creator-name").value =
        data.name || "";


    document.getElementById("creator-username").value =
        data.username || "";


    document.getElementById("creator-photo").value =
        "";


    document.getElementById("creator-bio").value =
        data.bio || "";


    document.getElementById("add-creator-form")
        .setAttribute(
            "data-editing-id",
            id
        );


    document.getElementById("add-creator-form")
        .style.display = "block";


    document.querySelector("#add-creator-form h2")
        .textContent = "Edit Creator";


    document.querySelector("#add-creator-form p")
        .textContent =
        "Update the creator information below.";


    window.scrollTo({
        top: document.getElementById("add-creator-form").offsetTop,
        behavior: "smooth"
    });

}


// ---------- DELETE CREATOR ----------

async function deleteCreator(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this creator?"
        );


    if (!confirmed) {

        return;

    }


    const { error } =
        await supabaseClient
            .from("creators")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "Failed to delete creator: " +
            error.message
        );

        return;

    }


    alert(
        "Creator deleted successfully!"
    );


    loadCreators();

}


// ---------- SEE ALL CREATORS ----------

document.getElementById("toggle-creators-button")
    .addEventListener("click", function () {

        const list =
            document.getElementById("creator-list");


        if (list.style.display === "none") {

            list.style.display = "block";

            this.textContent =
                "Hide creators ▲";

        }

        else {

            list.style.display = "none";

            this.textContent =
                "See all creators ▼";

        }

    });


// ---------- START ----------

loadCreators();

</script>

</body>

    </html>
