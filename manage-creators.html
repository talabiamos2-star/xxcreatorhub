<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Creators</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <h1>Manage Creators</h1>
<button id="add-creator-button">
    + Add Creator
</button>
    <div id="creator-list">
        Loading creators...
    </div>
<div id="add-creator-form"
     style="display:none;"
     data-editing-id="">

    <input
        type="text"
        id="creator-name"
        placeholder="Creator name"
    >

    <input
        type="text"
        id="creator-username"
        placeholder="Username"
    >

    <input
        type="text"
        id="creator-photo"
        placeholder="Photo URL"
    >

    <textarea
        id="creator-bio"
        placeholder="Bio"
    ></textarea>

    <button id="save-creator-button">
        Save Creator
    </button>

</div>
    <h2>Manage Exclusive Photos</h2>

<div id="exclusive-photo-section">

    <select id="exclusive-creator-select">
        <option value="">Select a creator</option>
    </select>

    <br><br>

    <input
        type="file"
        id="exclusive-photo-file"
        accept="image/*"
    >

    <button id="add-exclusive-photo-button">
        Add Photo
    </button>

    <div id="exclusive-photo-list">
        Select a creator to see their photos.
    </div>

</div>
    <h2>Manage Posts</h2>

<div id="manage-posts-section">

    <select id="post-creator-select">
        <option value="">Select a creator</option>
    </select>

    <br><br>

    <input
        type="file"
        id="post-image-file"
        accept="image/*"
    >

    <br><br>

    <input
        type="text"
        id="post-caption"
        placeholder="Post caption"
    >

    <br><br>

    <button id="add-post-button">
        Add Post
    </button>

    <div id="post-list">
        Select a creator to see their posts.
    </div>

</div>
<script>

const SUPABASE_URL =
    "https://hgqrtjuccspzwagntnxj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_nLNI7mX50vhJZfz6xf9JaQ_HKw2usMf";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


async function loadCreators() {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("*");
            

    if (error) {

        console.error(error);

        document.getElementById("creator-list").textContent =
    "Failed to load creators: " + error.message;

        return;
    }

    const list =
        document.getElementById("creator-list");

    if (!data || data.length === 0) {

        list.textContent =
            "No creators yet.";

        return;
    }

    list.innerHTML =
    data.map(creator => `
        <div>
            <h3>${creator.name}</h3>
            <p>@${creator.username}</p>

            <button onclick="editCreator(${creator.id})">
    Edit
</button>

<button onclick="deleteCreator(${creator.id})">
    Delete
</button>
        </div>
    `).join("");
}

document.getElementById("add-creator-button")
    .addEventListener("click", function () {

        document.getElementById("add-creator-form")
            .setAttribute("data-editing-id", "");

        document.getElementById("add-creator-form")
            .style.display = "block";

    });


document.getElementById("save-creator-button")
    .addEventListener("click", async function () {

        const name =
            document.getElementById("creator-name").value;

        const username =
            document.getElementById("creator-username").value;

        const photo_url =
            document.getElementById("creator-photo").value;

        const bio =
            document.getElementById("creator-bio").value;


        if (!name || !username || !photo_url) {

            alert("Please fill in name, username and photo URL.");

            return;
        }


        const form = document.getElementById("add-creator-form");
const editingId = form.getAttribute("data-editing-id");

let error;

if (editingId) {

    const result = await supabaseClient
        .from("creators")
        .update({
            name: name,
            username: username,
            photo_url: photo_url,
            bio: bio
        })
        .eq("id", editingId);

    error = result.error;

} else {

    const result = await supabaseClient
        .from("creators")
        .insert({
            name: name,
            username: username,
            photo_url: photo_url,
            bio: bio
        });

    error = result.error;
                                }


        if (error) {

            console.error(error);

            alert("Failed to save creator: " + error.message);

            return;
        }


        if (editingId) {
    alert("Creator updated successfully!");
} else {
    alert("Creator added successfully!");
    }


        document.getElementById("creator-name").value = "";
        document.getElementById("creator-username").value = "";
        document.getElementById("creator-photo").value = "";
        document.getElementById("creator-bio").value = "";
        document.getElementById("add-creator-form")
            .style.display = "none";


        loadCreators();

    });
    async function editCreator(id) {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("*")
            .eq("id", id)
            .single();

    if (error) {
        alert("Failed to load creator: " + error.message);
        return;
    }

    document.getElementById("creator-name").value =
        data.name || "";

    document.getElementById("creator-username").value =
        data.username || "";

    document.getElementById("creator-photo").value =
        data.photo_url || "";

    document.getElementById("creator-bio").value =
        data.bio || "";

    document.getElementById("add-creator-form")
        .setAttribute("data-editing-id", id);

        document.getElementById("add-creator-form")
        .style.display = "block";
    }
async function deleteCreator(id) {

    const confirmed =
        confirm("Are you sure you want to delete this creator?");

    if (!confirmed) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("creators")
            .delete()
            .eq("id", id);

    if (error) {
        console.error(error);
        alert("Failed to delete creator: " + error.message);
        return;
    }

    alert("Creator deleted successfully!");

    loadCreators();
        }
async function loadExclusiveCreators() {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("id, name, username");

    if (error) {
        console.error("Exclusive creator error:", error);
        return;
    }

    const select =
        document.getElementById("exclusive-creator-select");

    select.innerHTML =
        '<option value="">Select a creator</option>';

    data.forEach(creator => {

        const option =
            document.createElement("option");

        option.value = creator.id;

        option.textContent =
            `${creator.name} (@${creator.username})`;

        select.appendChild(option);
    });
}
document.getElementById("add-exclusive-photo-button")
    .addEventListener("click", async function () {

        const creatorId =
            document.getElementById("exclusive-creator-select").value;

        const fileInput =
            document.getElementById("exclusive-photo-file");

        const file = fileInput.files[0];

        if (!creatorId) {
            alert("Please select a creator.");
            return;
        }

        if (!file) {
            alert("Please select a photo.");
            return;
        }

        const fileName =
            Date.now() + "_" + file.name;

        const { error: uploadError } =
            await supabaseClient
                .storage
                .from("images")
                .upload(fileName, file);

        if (uploadError) {
            console.error(uploadError);
            alert("Failed to upload photo: " + uploadError.message);
            return;
        }

        const { data: publicData } =
            supabaseClient
                .storage
                .from("images")
                .getPublicUrl(fileName);

        const { error: databaseError } =
            await supabaseClient
                .from("exclusive_photos")
.insert({
    creator_id: creatorId,
    photo_url: publicData.publicUrl,
    storage_path: fileName
});

        if (databaseError) {
            console.error(databaseError);
            alert("Photo uploaded but failed to save: " + databaseError.message);
            return;
        }

        alert("Exclusive photo added successfully!");

        fileInput.value = "";

    });
    async function loadExclusivePhotos() {

    const creatorId =
        document.getElementById("exclusive-creator-select").value;

    const list =
        document.getElementById("exclusive-photo-list");

    if (!creatorId) {
        list.textContent =
            "Select a creator to see their photos.";
        return;
    }

    const { data, error } =
        await supabaseClient
            .from("exclusive_photos")
            .select("*")
            .eq("creator_id", creatorId)
            .order("created_at", { ascending: true });

    if (error) {
        console.error(error);
        list.textContent =
            "Failed to load photos: " + error.message;
        return;
    }

    if (!data || data.length === 0) {
        list.textContent =
            "No exclusive photos yet.";
        return;
    }

    list.innerHTML = data.map(photo => `
        <div style="margin-bottom:15px;">

    <img
        src="${photo.photo_url}"
        style="width:150px; height:150px; object-fit:cover;"
    >

    <br>

    <button onclick="deleteExclusivePhoto(${photo.id})">
        Delete
    </button>

</div>
    `).join("");
    }
loadExclusiveCreators();
    document.getElementById("exclusive-creator-select")
    .addEventListener("change", loadExclusivePhotos);
    async function deleteExclusivePhoto(id) {

    const confirmed =
        confirm("Are you sure you want to delete this photo?");

    if (!confirmed) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("exclusive_photos")
            .delete()
            .eq("id", id);

    if (error) {
        console.error(error);
        alert("Failed to delete photo: " + error.message);
        return;
    }

    alert("Exclusive photo deleted successfully!");

    loadExclusivePhotos();
        }
async function loadPostCreators() {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("id, name, username");

    if (error) {
        console.error("Post creator error:", error);
        return;
    }

    const select =
        document.getElementById("post-creator-select");

    select.innerHTML =
        '<option value="">Select a creator</option>';

    data.forEach(creator => {

        const option =
            document.createElement("option");

        option.value = creator.id;

        option.textContent =
            `${creator.name} (@${creator.username})`;

        select.appendChild(option);

    });
}

async function addPost() {

    const creatorId =
        document.getElementById("post-creator-select").value;

    const fileInput =
        document.getElementById("post-image-file");

    const file = fileInput.files[0];

    const caption =
        document.getElementById("post-caption").value;

    if (!creatorId) {
        alert("Please select a creator.");
        return;
    }

    if (!file) {
        alert("Please select a post image.");
        return;
    }

    const fileName =
        Date.now() + "_post_" + file.name;

    const { error: uploadError } =
        await supabaseClient
            .storage
            .from("images")
            .upload(fileName, file);

    if (uploadError) {
        console.error(uploadError);
        alert("Failed to upload post image: " + uploadError.message);
        return;
    }

    const { data: publicData } =
        supabaseClient
            .storage
            .from("images")
            .getPublicUrl(fileName);

    const { error: databaseError } =
        await supabaseClient
            .from("posts")
            .insert({
                creator_id: creatorId,
                image_url: publicData.publicUrl,
                caption: caption
            });

    if (databaseError) {
        console.error(databaseError);
        alert("Image uploaded but failed to create post: " + databaseError.message);
        return;
    }

    alert("Post added successfully!");

    fileInput.value = "";
    document.getElementById("post-caption").value = "";
}

document.getElementById("add-post-button")
    .addEventListener("click", addPost);

async function loadPosts() {

    const creatorId =
        document.getElementById("post-creator-select").value;

    const list =
        document.getElementById("post-list");

    if (!creatorId) {
        list.textContent =
            "Select a creator to see their posts.";
        return;
    }

    const { data, error } =
        await supabaseClient
            .from("posts")
            .select("*")
            .eq("creator_id", creatorId)
            .order("created_at", { ascending: false });

    if (error) {
        console.error(error);

        list.textContent =
            "Failed to load posts: " + error.message;

        return;
    }

    if (!data || data.length === 0) {

        list.textContent =
            "No posts yet.";

        return;
    }

    list.innerHTML =
        data.map(post => `
            <div style="margin-bottom:20px;">

                <img
                    src="${post.image_url}"
                    style="width:150px; height:150px; object-fit:cover;"
                >

                <p>${post.caption || ""}</p>

<button onclick="editPost(${post.id}, '${post.image_url}')">
    Edit
</button>
<button onclick="deletePost(${post.id})">
    Delete
</button>

</div>
        `).join("");
}
async function deletePost(id) {

    const confirmed =
        confirm("Are you sure you want to delete this post?");

    if (!confirmed) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("posts")
            .delete()
            .eq("id", id);

        if (error) {
        console.error(error);
        alert("Failed to delete post: " + error.message);
        return;
    }

    alert("Post deleted successfully!");

    loadPosts();
}

async function editPost(id) {

    const newCaption = prompt("Enter the new caption:");

    if (newCaption === null) {
        return;
    }

    const { error } = await supabaseClient
        .from("posts")
        .update({
            caption: newCaption
        })
        .eq("id", id);

    if (error) {
        console.error(error);
        alert("Failed to update post: " + error.message);
        return;
    }

    alert("Post updated successfully!");

        loadPosts();
}
    
document.getElementById("post-creator-select")
    .addEventListener("change", loadPosts);

loadCreators();
loadPostCreators();

</script>
</body>

</html>
