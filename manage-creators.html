<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Creators</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <h1>Manage Creators</h1>
<button id="add-creator-button">
    + Add Creator
</button>

<p id="creator-count">
    Loading creators...
</p>

<button id="toggle-creators-button">
    See all creators ▼
</button>

<div id="creator-list" style="display:none;">
    Loading creators...
</div>
<div id="add-creator-form"
     style="display:none;"
     data-editing-id="">

    <input
        type="text"
        id="creator-name"
        placeholder="Creator name"
    >

    <input
        type="text"
        id="creator-username"
        placeholder="Username"
    >

    <input
    type="file"
    id="creator-photo"
    accept="image/*"
>

    <textarea
        id="creator-bio"
        placeholder="Bio"
    ></textarea>

    <button id="save-creator-button">
        Save Creator
    </button>

</div>
    <script>

const SUPABASE_URL =
    "https://hgqrtjuccspzwagntnxj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_nLNI7mX50vhJZfz6xf9JaQ_HKw2usMf";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ---------- LOAD CREATORS ----------

async function loadCreators() {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("*");

    if (error) {

        console.error(error);

        document.getElementById("creator-count").textContent =
            "Failed to load creators.";

        document.getElementById("creator-list").textContent =
            "Error: " + error.message;

        return;
    }

    const list =
        document.getElementById("creator-list");

    if (!data || data.length === 0) {

        document.getElementById("creator-count").textContent =
            "0 creators";

        list.textContent =
            "No creators yet.";

        return;
    }

    document.getElementById("creator-count").textContent =
        data.length +
        (data.length === 1
            ? " creator"
            : " creators");

    list.innerHTML =
        data.map(creator => `
            <div>

                <h3>${creator.name}</h3>

                <p>@${creator.username}</p>

                <button onclick="editCreator(${creator.id})">
                    Edit
                </button>

                <button onclick="deleteCreator(${creator.id})">
                    Delete
                </button>

            </div>
        `).join("");
}


// ---------- ADD CREATOR BUTTON ----------

document.getElementById("add-creator-button")
    .addEventListener("click", function () {

        document.getElementById("add-creator-form")
            .setAttribute("data-editing-id", "");

        document.getElementById("add-creator-form")
            .style.display = "block";

    });


// ---------- SAVE CREATOR ----------

document.getElementById("save-creator-button")
    .addEventListener("click", async function () {

        const name =
            document.getElementById("creator-name").value;

        const username =
            document.getElementById("creator-username").value;

        const photoFile =

            alert(
                "Please fill in name, username and photo URL."
            );

            return;
        }

        const form =
            document.getElementById("add-creator-form");

        const editingId =
            form.getAttribute("data-editing-id");

        let error;

        if (editingId) {

            const result =
                await supabaseClient
                    .from("creators")
                    .update({
                        name: name,
                        username: username,
                        photo_url: photo_url,
                        bio: bio
                    })
                    .eq("id", editingId);

            error = result.error;

        } else {

            const result =
                await supabaseClient
                    .from("creators")
                    .insert({
                        name: name,
                        username: username,
                        photo_url: photo_url,
                        bio: bio
                    });

            error = result.error;
        }

        if (error) {

            console.error(error);

            alert(
                "Failed to save creator: " +
                error.message
            );

            return;
        }

        alert(
            editingId
                ? "Creator updated successfully!"
                : "Creator added successfully!"
        );

        document.getElementById("creator-name").value = "";
        document.getElementById("creator-username").value = "";
        document.getElementById("creator-photo").value = "";
        document.getElementById("creator-bio").value = "";

        form.style.display = "none";

        loadCreators();

    });


// ---------- EDIT CREATOR ----------

async function editCreator(id) {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("*")
            .eq("id", id)
            .single();

    if (error) {

        alert(
            "Failed to load creator: " +
            error.message
        );

        return;
    }

    document.getElementById("creator-name").value =
        data.name || "";

    document.getElementById("creator-username").value =
        data.username || "";

    document.getElementById("creator-photo").value =
        data.photo_url || "";

    document.getElementById("creator-bio").value =
        data.bio || "";

    document.getElementById("add-creator-form")
        .setAttribute("data-editing-id", id);

    document.getElementById("add-creator-form")
        .style.display = "block";

}


// ---------- DELETE CREATOR ----------

async function deleteCreator(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this creator?"
        );

    if (!confirmed) {
        return;
    }

    const { error } =
        await supabaseClient
            .from("creators")
            .delete()
            .eq("id", id);

    if (error) {

        console.error(error);

        alert(
            "Failed to delete creator: " +
            error.message
        );

        return;
    }

    alert("Creator deleted successfully!");

    loadCreators();

}


// ---------- SEE ALL CREATORS ----------

document.getElementById("toggle-creators-button")
    .addEventListener("click", function () {

        const list =
            document.getElementById("creator-list");

        if (list.style.display === "none") {

            list.style.display = "block";

            this.textContent =
                "Hide creators ▲";

        } else {

            list.style.display = "none";

            this.textContent =
                "See all creators ▼";
        }

    });


// ---------- START ----------

loadCreators();

    </script>

</body>

</html>
