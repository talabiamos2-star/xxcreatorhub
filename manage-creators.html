<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Creators</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <h1>Manage Creators</h1>
<button id="add-creator-button">
    + Add Creator
</button>

<p id="creator-count">
    Loading creators...
</p>

<button id="toggle-creators-button">
    See all creators ▼
</button>

<div id="creator-list" style="display:none;">
    Loading creators...
</div>
<div id="add-creator-form"
     style="display:none;"
     data-editing-id="">

    <input
        type="text"
        id="creator-name"
        placeholder="Creator name"
    >

    <input
        type="text"
        id="creator-username"
        placeholder="Username"
    >

    <input
        type="text"
        id="creator-photo"
        placeholder="Photo URL"
    >

    <textarea
        id="creator-bio"
        placeholder="Bio"
    ></textarea>

    <button id="save-creator-button">
        Save Creator
    </button>

</div>
    
<script>

document.getElementById("toggle-creators-button")
    .addEventListener("click", function () {

        const list =
            document.getElementById("creator-list");

        if (list.style.display === "none") {

            list.style.display = "block";

            this.textContent =
                "Hide creators ▲";

        } else {

            list.style.display = "none";

            this.textContent =
                "See all creators ▼";
        }

    });
loadCreators();

</script>
</body>

</html>
