<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Manage Posts</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #08080d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .admin-container {
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            padding: 24px 18px 40px;
        }

        /* ---------- HEADER ---------- */

        .page-header {
            margin-bottom: 24px;
        }

        .page-header h1 {
            margin: 0;
            font-size: 27px;
        }

        .page-header p {
            margin: 7px 0 0;
            color: #8f8f9d;
            font-size: 13px;
        }

        /* ---------- ADD POST CARD ---------- */

        .upload-card {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 20px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .upload-card h2 {
            margin: 0 0 5px;
            font-size: 18px;
        }

        .upload-card > p {
            margin: 0 0 18px;
            color: #8f8f9d;
            font-size: 12px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-label {
            display: block;
            margin-bottom: 7px;
            color: #b7b7c3;
            font-size: 12px;
        }

        select,
        input[type="text"] {
            width: 100%;
            background: #0b0b11;
            border: 1px solid #2c2c38;
            border-radius: 12px;
            color: #ffffff;
            padding: 13px;
            font-size: 14px;
            outline: none;
        }

        select:focus,
        input[type="text"]:focus {
            border-color: #8b4dff;
        }

        /* ---------- FILE INPUT ---------- */

        .file-box {
            background: #0b0b11;
            border: 1px dashed #3a3a49;
            border-radius: 13px;
            padding: 13px;
        }

        input[type="file"] {
            width: 100%;
            color: #aaaab5;
            font-size: 12px;
        }

        input[type="file"]::file-selector-button {
            border: none;
            border-radius: 9px;
            padding: 9px 12px;
            margin-right: 10px;
            background: #242431;
            color: #ffffff;
            cursor: pointer;
        }

        /* ---------- ADD BUTTON ---------- */

        #add-post-button {
            width: 100%;
            border: none;
            border-radius: 13px;
            padding: 14px;
            background: linear-gradient(
                135deg,
                #ff3f9f,
                #8b4dff
            );
            color: #ffffff;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        #add-post-button:active {
            transform: scale(0.98);
        }

        /* ---------- POSTS SECTION ---------- */

        .posts-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 5px 0 13px;
        }

        .posts-header h2 {
            margin: 0;
            font-size: 18px;
        }

        .post-list {
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        /* ---------- POST CARD ---------- */

        .post-card {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 13px;
        }

        .post-image {
            width: 100%;
            aspect-ratio: 1 / 1;
            object-fit: cover;
            border-radius: 13px;
            display: block;
            background: #0b0b11;
        }

        .post-caption {
            margin: 12px 2px;
            color: #d7d7df;
            font-size: 13px;
            line-height: 1.5;
            word-break: break-word;
        }

        .post-actions {
            display: flex;
            gap: 8px;
        }

        .edit-button,
        .delete-button {
            flex: 1;
            border: none;
            border-radius: 11px;
            padding: 11px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
        }

        .edit-button {
            background: #242431;
            color: #ffffff;
        }

        .delete-button {
            background: #2a151d;
            color: #ff6b91;
        }

        /* ---------- EMPTY ---------- */

        .empty-message {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            color: #888895;
            font-size: 13px;
        }

    </style>

</head>

<body>

<div class="admin-container">

    <div class="page-header">

        <h1>Manage Posts</h1>

        <p>
            Add and manage creator posts.
        </p>

    </div>


    <!-- ---------- ADD POST ---------- -->

    <div class="upload-card">

        <h2>Add New Post</h2>

        <p>
            Select a creator and upload a post image.
        </p>


        <div class="form-group">

            <label class="form-label">
                Creator
            </label>

            <select id="post-creator-select">

                <option value="">
                    Select a creator
                </option>

            </select>

        </div>


        <div class="form-group">

            <label class="form-label">
                Post Image
            </label>

            <div class="file-box">

                <input
                    type="file"
                    id="post-image-file"
                    accept="image/*"
                >

            </div>

        </div>


        <div class="form-group">

            <label class="form-label">
                Caption
            </label>

            <input
                type="text"
                id="post-caption"
                placeholder="Post caption"
            >

        </div>


        <button id="add-post-button">
            + Add Post
        </button>

    </div>


    <!-- ---------- POSTS ---------- -->

    <div class="posts-header">

        <h2>Creator Posts</h2>

    </div>


    <div
        id="post-list"
        class="post-list"
    >
        <div class="empty-message">
            Select a creator to see their posts.
        </div>
    </div>

</div>


<script>

const SUPABASE_URL =
    "https://hgqrtjuccspzwagntnxj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_nLNI7mX50vhJZfz6xf9JaQ_HKw2usMf";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ===============================
// LOAD CREATORS
// ===============================

async function loadPostCreators() {

    const { data, error } =
        await supabaseClient
            .from("creators")
            .select("id, name, username");

    if (error) {

        console.error(
            "Post creator error:",
            error
        );

        return;
    }


    const select =
        document.getElementById(
            "post-creator-select"
        );


    select.innerHTML =
        '<option value="">Select a creator</option>';


    data.forEach(creator => {

        const option =
            document.createElement("option");


        option.value =
            creator.id;


        option.textContent =
            `${creator.name} (@${creator.username})`;


        select.appendChild(option);

    });

}


// ===============================
// ADD POST
// ===============================

async function addPost() {

    const creatorId =
        document.getElementById(
            "post-creator-select"
        ).value;


    const fileInput =
        document.getElementById(
            "post-image-file"
        );


    const file =
        fileInput.files[0];


    const caption =
        document.getElementById(
            "post-caption"
        ).value;


    if (!creatorId) {

        alert(
            "Please select a creator."
        );

        return;
    }


    if (!file) {

        alert(
            "Please select a post image."
        );

        return;
    }


    const fileName =
        Date.now() +
        "_post_" +
        file.name;


    const { error: uploadError } =
        await supabaseClient
            .storage
            .from("images")
            .upload(
                fileName,
                file
            );


    if (uploadError) {

        console.error(uploadError);

        alert(
            "Failed to upload post image: " +
            uploadError.message
        );

        return;
    }


    const { data: publicData } =
        supabaseClient
            .storage
            .from("images")
            .getPublicUrl(fileName);


    const imageUrl =
        publicData.publicUrl;


    const { error: databaseError } =
        await supabaseClient
            .from("posts")
            .insert({
                creator_id: creatorId,
                image_url: imageUrl,
                caption: caption
            });


    if (databaseError) {

        console.error(databaseError);

        alert(
            "Image uploaded but failed to create post: " +
            databaseError.message
        );

        return;
    }


    alert(
        "Post added successfully!"
    );


    fileInput.value = "";

    document.getElementById(
        "post-caption"
    ).value = "";


    loadPosts();

}


// ===============================
// LOAD POSTS
// ===============================

async function loadPosts() {

    const creatorId =
        document.getElementById(
            "post-creator-select"
        ).value;


    const list =
        document.getElementById(
            "post-list"
        );


    if (!creatorId) {

        list.innerHTML =
            `<div class="empty-message">
                Select a creator to see their posts.
            </div>`;

        return;
    }


    const { data, error } =
        await supabaseClient
            .from("posts")
            .select("*")
            .eq(
                "creator_id",
                creatorId
            )
            .order(
                "created_at",
                {
                    ascending: false
                }
            );


    if (error) {

        console.error(error);

        list.innerHTML =
            `<div class="empty-message">
                Failed to load posts:
                ${error.message}
            </div>`;

        return;
    }


    if (!data || data.length === 0) {

        list.innerHTML =
            `<div class="empty-message">
                No posts yet.
            </div>`;

        return;
    }


    list.innerHTML =
        data.map(post => `

            <div class="post-card">

                <img
                    src="${post.image_url}"
                    class="post-image"
                    alt="Creator post"
                >


                <div class="post-caption">

                    ${post.caption || "No caption"}

                </div>


                <div class="post-actions">

                    <button
                        class="edit-button"
                        onclick="editPost(${post.id})"
                    >
                        Edit Caption
                    </button>


                    <button
                        class="delete-button"
                        onclick="deletePost(${post.id})"
                    >
                        Delete
                    </button>

                </div>

            </div>

        `).join("");

}


// ===============================
// EDIT CAPTION
// ===============================

async function editPost(id) {

    const newCaption =
        prompt(
            "Enter the new caption:"
        );


    if (newCaption === null) {

        return;
    }


    const { error } =
        await supabaseClient
            .from("posts")
            .update({
                caption: newCaption
            })
            .eq(
                "id",
                id
            );


    if (error) {

        console.error(error);

        alert(
            "Failed to update post: " +
            error.message
        );

        return;
    }


    alert(
        "Caption updated successfully!"
    );


    loadPosts();

}


// ===============================
// DELETE POST
// ===============================

async function deletePost(id) {

    const confirmed =
        confirm(
            "Are you sure you want to delete this post?"
        );


    if (!confirmed) {

        return;
    }


    const { error } =
        await supabaseClient
            .from("posts")
            .delete()
            .eq(
                "id",
                id
            );


    if (error) {

        console.error(error);

        alert(
            "Failed to delete post: " +
            error.message
        );

        return;
    }


    alert(
        "Post deleted successfully!"
    );


    loadPosts();

}


// ===============================
// BUTTONS
// ===============================

document.getElementById(
    "add-post-button"
)
.addEventListener(
    "click",
    addPost
);


document.getElementById(
    "post-creator-select"
)
.addEventListener(
    "change",
    loadPosts
);


// ===============================
// START
// ===============================

loadPostCreators();

</script>

</body>

    </html>
