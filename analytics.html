<!DOCTYPE html>
<html lang="en">
<head>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL =
            "https://hgqrtjuccspzwagntnxj.supabase.co";

        const SUPABASE_KEY =

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>XX CreatorHub Analytics</title>

    <style>

        body {
            margin: 0;
            padding: 20px;
            background: #08080d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .analytics-header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .back-button {
            width: 42px;
            height: 42px;
            border: 1px solid #292936;
            border-radius: 12px;
            background: #121218;
            color: #ffffff;
            font-size: 20px;
            cursor: pointer;
        }

        .analytics-header h1 {
            margin: 0;
            font-size: 23px;
        }

        .analytics-header span {
            color: #ff4fa3;
            font-size: 12px;
        }

        .analytics-card {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .analytics-card p {
            margin: 0 0 8px;
            color: #999;
            font-size: 13px;
        }

        .analytics-card strong {
            font-size: 28px;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }
.rolling-analytics {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-top: 15px;
}

.rolling-analytics > div {
    background: #08080d;
    border: 1px solid #292936;
    border-radius: 14px;
    padding: 14px 8px;
    text-align: center;
}

.rolling-analytics span {
    display: block;
    color: #999;
    font-size: 11px;
    margin-bottom: 8px;
}

.rolling-analytics strong {
    font-size: 22px;
    color: #ffffff;
        }
        .traffic-chart {
    margin-top: 15px;
    height: 230px;
    background: #08080d;
    border: 1px solid #292936;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.chart-placeholder {
    color: #777;
    font-size: 13px;
    text-align: center;
}
    </style>

</head>

<body>

    <div class="analytics-header">

        <button
            class="back-button"
            onclick="history.back()"
        >
            ←
        </button>

        <div>
            <h1>XX CreatorHub</h1>
            <span>Analytics</span>
        </div>

    </div>

    <div class="analytics-grid">

        <div class="analytics-card">
            <p>Total Visits</p>
            <strong id="analytics-total-visits">0</strong>
        </div>

        <div class="analytics-card">
            <p>Total Unlocks</p>
            <strong id="analytics-total-unlocks">0</strong>
        </div>

    </div>

<script>

async function loadAnalytics() {

    const { count: visitCount, error: visitError } =
        await supabaseClient
            .from("site_visits")
            .select("*", {
                count: "exact",
                head: true
            });

    if (visitError) {
        console.error(
            "Analytics visits error:",
            visitError
        );
    } else {
        document.getElementById(
            "analytics-total-visits"
        ).textContent = visitCount || 0;
    }


    const { count: unlockCount, error: unlockError } =
        await supabaseClient
            .from("unlock_events")
            .select("*", {
                count: "exact",
                head: true
            });

    if (unlockError) {
        console.error(
            "Analytics unlocks error:",
            unlockError
        );
    } else {
        document.getElementById(
            "analytics-total-unlocks"
        ).textContent = unlockCount || 0;
    }


    // ===============================
    // ROLLING VISIT ANALYTICS
    // ===============================

    const now = new Date();

    const last24Hours =
        new Date(now.getTime() - 24 * 60 * 60 * 1000);

    const last7Days =
        new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    const last30Days =
        new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);


    const { count: visits24h, error: error24h } =
        await supabaseClient
            .from("site_visits")
            .select("*", {
                count: "exact",
                head: true
            })
            .gte(
                "created_at",
                last24Hours.toISOString()
            );


    const { count: visits7d, error: error7d } =
        await supabaseClient
            .from("site_visits")
            .select("*", {
                count: "exact",
                head: true
            })
            .gte(
                "created_at",
                last7Days.toISOString()
            );


    const { count: visits30d, error: error30d } =
        await supabaseClient
            .from("site_visits")
            .select("*", {
                count: "exact",
                head: true
            })
            .gte(
                "created_at",
                last30Days.toISOString()
            );


    if (!error24h) {
        document.getElementById(
            "analytics-24h"
        ).textContent = visits24h || 0;
    }


    if (!error7d) {
        document.getElementById(
            "analytics-7d"
        ).textContent = visits7d || 0;
    }


        if (!error30d) {
        document.getElementById(
            "analytics-30d"
        ).textContent = visits30d || 0;
    }

    const { data: visitData, error: chartError } =
        await supabaseClient
            .from("site_visits")
            .select("created_at")
            .gte(
                "created_at",
                new Date(
                    Date.now() - 30 * 24 * 60 * 60 * 1000
                ).toISOString()
            )
            .order("created_at", { ascending: true });

    if (chartError) {
        console.error("Chart data error:", chartError);
    } else {
        const dailyVisits = {};

        visitData.forEach(visit => {
            const date =
                new Date(visit.created_at)
                    .toISOString()
                    .split("T")[0];

            dailyVisits[date] =
                (dailyVisits[date] || 0) + 1;
        });

        const canvas =
            document.getElementById("traffic-chart");

        if (canvas) {
            const ctx = canvas.getContext("2d");

            new Chart(ctx, {
                type: "line",
                data: {
                    labels: Object.keys(dailyVisits),
                    datasets: [{
                        label: "Visits",
                        data: Object.values(dailyVisits),
                        tension: 0.35,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            display: false
                        }
                    },
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                precision: 0
                            }
                        }
                    }
                }
            });
        }
    }
}

loadAnalytics();
    await supabaseClient
        .from("site_visits")
        .select("created_at")
        .gte(
            "created_at",
            new Date(
                Date.now() - 30 * 24 * 60 * 60 * 1000
            ).toISOString()
        )
        .order("created_at", { ascending: true });

if (chartError) {
    console.error("Chart data error:", chartError);
} else {
    const dailyVisits = {};

    visitData.forEach(visit => {
        const date =
            new Date(visit.created_at)
                .toISOString()
                .split("T")[0];

        dailyVisits[date] =
            (dailyVisits[date] || 0) + 1;
    });

    const canvas =
        document.getElementById("traffic-chart");

    if (canvas) {
        const ctx = canvas.getContext("2d");

        new Chart(ctx, {
            type: "line",
            data: {
                labels: Object.keys(dailyVisits),
                datasets: [{
                    label: "Visits",
                    data: Object.values(dailyVisits),
                    tension: 0.35,
                    fill: true
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        display: false
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            precision: 0
                        }
                    }
                }
            }
        });
    }
    }


</script>


<div class="analytics-card">
    <p>Visit Analytics</p>

    <div class="rolling-analytics">

        <div>
            <span>Last 24 Hours</span>
            <strong id="analytics-24h">0</strong>
        </div>

        <div>
            <span>Last 7 Days</span>
            <strong id="analytics-7d">0</strong>
        </div>

        <div>
            <span>Last 30 Days</span>
            <strong id="analytics-30d">0</strong>
        </div>

    </div>
</div>
<div class="analytics-card">

    <p>Traffic — Last 30 Days</p>

    <div class="traffic-chart">
    <canvas id="traffic-chart"></canvas>
    </div>
</div>

</body>
    </html>
