<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Add Creator</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <h1>Add Creator</h1>

    <div id="add-creator-form">

        <input
            type="text"
            id="creator-name"
            placeholder="Creator name"
        >

        <br><br>

        <input
            type="text"
            id="creator-username"
            placeholder="Username"
        >

        <br><br>

       <input
    type="file"
    id="creator-photo"
    accept="image/*"
>

        <br><br>

        <textarea
            id="creator-bio"
            placeholder="Bio"
        ></textarea>

        <br><br>

        <button id="save-creator-button">
            Save Creator
        </button>

    </div>


<script>

const SUPABASE_URL =
    "https://hgqrtjuccspzwagntnxj.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_nLNI7mX50vhJZfz6xf9JaQ_HKw2usMf";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


document.getElementById("save-creator-button")
    .addEventListener("click", async function () {

        const name =
            document.getElementById("creator-name").value;

        const username =
            document.getElementById("creator-username").value;

        const photoFile =
    document.getElementById("creator-photo").files[0];
        const bio =
            document.getElementById("creator-bio").value;


        if (!name || !username || !photoFile) {

            alert(
                "Please fill in name, username and photo URL."
            );

            return;
        }


        const fileName =
    Date.now() + "_creator_" + photoFile.name;

const { error: uploadError } =
    await supabaseClient
        .storage
        .from("images")
        .upload(fileName, photoFile);

if (uploadError) {

    console.error(uploadError);

    alert(
        "Failed to upload profile photo: " +
        uploadError.message
    );

    return;
}

const { data: publicData } =
    supabaseClient
        .storage
        .from("images")
        .getPublicUrl(fileName);

const photo_url =
    publicData.publicUrl;


const { error } =
    await supabaseClient
        .from("creators")
        .insert({
            name: name,
            username: username,
            photo_url: photo_url,
            bio: bio
        });
                    name: name,
                    username: username,
                    photo_url: photo_url,
                    bio: bio
                });


        if (error) {

            console.error(error);

            alert(
                "Failed to add creator: " +
                error.message
            );

            return;
        }


        alert("Creator added successfully!");


        document.getElementById("creator-name").value = "";

        document.getElementById("creator-username").value = "";

        document.getElementById("creator-photo").value = "";

        document.getElementById("creator-bio").value = "";

    });

</script>

</body>

              </html>
