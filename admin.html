<html lang="en">
<head>

const SUPABASE_URL = "https://hgqrtjuccspzwagntnxj.supabase.co";

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XX CreatorHub Admin</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #08080d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .admin-header span {
            color: #ff4fa3;
            font-size: 13px;
        }

        .dashboard-card {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .dashboard-card h2 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .dashboard-card p {
            margin: 0;
            color: #999;
            font-size: 13px;
        }
.stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 25px;
}

.stat-card {
    background: #121218;
    border: 1px solid #292936;
    border-radius: 16px;
    padding: 15px;
    display: flex;
    align-items: center;
    gap: 12px;
}

.stat-icon {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(
        135deg,
        #ff3f9f,
        #8b4dff
    );
    font-size: 20px;
}

.stat-card p {
    margin: 0 0 5px;
    color: #999;
    font-size: 12px;
}

.stat-card strong {
    font-size: 21px;
    color: #ffffff;
        }
        .admin-menu {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        .admin-menu button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(
                135deg,
                #ff3f9f,
                #8b4dff
            );
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="admin-header">
        <div>
            <h1>XX CreatorHub</h1>
            <span>Admin Dashboard</span>
        </div>
    </div>

    <div class="stats-grid">

    <div class="stat-card">
        <span class="stat-icon">👀</span>
        <div>
            <p>Total Visits</p>
            <strong id="total-visits">0</strong>
        </div>
    </div>

    <div class="stat-card">
        <span class="stat-icon">🔓</span>
        <div>
            <p>Total Unlocks</p>
            <strong>0</strong>
        </div>
    </div>

    <div class="stat-card">
        <span class="stat-icon">👩</span>
        <div>
            <p>Total Creators</p>
            <strong id="total-creators">0</strong>
        </div>
    </div>

    <div class="stat-card">
        <span class="stat-icon">📝</span>
        <div>
            <p>Total Posts</p>
            <strong id="total-posts">0</strong>
        </div>
    </div>
<div class="stat-card">
    <span class="stat-icon">📺</span>
    <div>
        <p>Total Ads Watched</p>
        <strong id="total-ads-watched">0</strong>
    </div>
    </div>
    </div>

    <div class="admin-menu">

        <button>Add Creator</button>

        <button>Manage Creators</button>

        <button>Manage Posts</button>

        <button>Manage Exclusive Content</button>

        <button>View Analytics</button>

    </div>
<script>
async function loadDashboardStats() {

    const { count: creatorCount, error: creatorError } =
        await supabaseClient
            .from("creators")
            .select("*", { count: "exact", head: true });

    if (!creatorError) {
        document.getElementById("total-creators").textContent =
            creatorCount || 0;
    }

    const { count: postCount, error: postError } =
        await supabaseClient
            .from("posts")
            .select("*", { count: "exact", head: true });

if (!postError) {
    document.getElementById("total-posts").textContent =
        postCount || 0;
}

const { count: visitCount, error: visitError } =
    await supabaseClient
        .from("site_visits")
        .select("*", { count: "exact", head: true });

if (visitError) {
    console.error("Visit count error:", visitError);
} else {
    console.log("Visit count:", visitCount);
document.getElementById("total-visits").textContent =
    visitCount || 0;
    }

    }

loadDashboardStats();
</script>
</body>
