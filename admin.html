<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>XX CreatorHub Admin</title>

    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #08080d;
            color: #ffffff;
            font-family: Arial, sans-serif;
        }

        .admin-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 25px;
        }

        .admin-header h1 {
            margin: 0;
            font-size: 24px;
        }

        .admin-header span {
            color: #ff4fa3;
            font-size: 13px;
        }

        .dashboard-card {
            background: #121218;
            border: 1px solid #292936;
            border-radius: 18px;
            padding: 18px;
            margin-bottom: 15px;
        }

        .dashboard-card h2 {
            margin: 0 0 8px;
            font-size: 16px;
        }

        .dashboard-card p {
            margin: 0;
            color: #999;
            font-size: 13px;
        }

        .admin-menu {
            display: grid;
            gap: 12px;
            margin-top: 20px;
        }

        .admin-menu button {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(
                135deg,
                #ff3f9f,
                #8b4dff
            );
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="admin-header">
        <div>
            <h1>XX CreatorHub</h1>
            <span>Admin Dashboard</span>
        </div>
    </div>

    <div class="dashboard-card">
        <h2>Welcome, Admin 👋</h2>
        <p>Manage your creators, posts and exclusive content.</p>
    </div>

    <div class="admin-menu">

        <button>Add Creator</button>

        <button>Manage Creators</button>

        <button>Manage Posts</button>

        <button>Manage Exclusive Content</button>

        <button>View Analytics</button>

    </div>

</body>
      </html>
