<script>
async function loadDashboardStats() {

    const { count: creatorCount, error: creatorError } =
        await supabaseClient
            .from("creators")
            .select("*", { count: "exact", head: true });

    if (!creatorError) {
        document.getElementById("total-creators").textContent =
            creatorCount || 0;
    }

    const { count: postCount, error: postError } =
        await supabaseClient
            .from("posts")
            .select("*", { count: "exact", head: true });

if (!postError) {
    document.getElementById("total-posts").textContent =
        postCount || 0;
}

const { count: visitCount, error: visitError } =
    await supabaseClient
        .from("site_visits")
        .select("*", { count: "exact", head: true });

if (visitError) {
    console.error("Visit count error:", visitError);
} else {
    console.log("Visit count:", visitCount);
document.getElementById("total-visits").textContent =
    visitCount || 0;
    }
        // ===============================
    // ROLLING VISIT ANALYTICS
    // ===============================

    const now = new Date();

    const last24Hours =
        new Date(now.getTime() - 24 * 60 * 60 * 1000);

    const last7Days =
        new Date(now.getTime() - 7 * 24 * 60 * 60 * 1000);

    const last30Days =
        new Date(now.getTime() - 30 * 24 * 60 * 60 * 1000);


    const { count: visits24h, error: error24h } =
        await supabaseClient
            .from("site_visits")
            .select("*", { count: "exact", head: true })
            .gte("created_at", last24Hours.toISOString());


    const { count: visits7d, error: error7d } =
        await supabaseClient
            .from("site_visits")
            .select("*", { count: "exact", head: true })
            .gte("created_at", last7Days.toISOString());


    const { count: visits30d, error: error30d } =
        await supabaseClient
            .from("site_visits")
            .select("*", { count: "exact", head: true })
            .gte("created_at", last30Days.toISOString());


    if (error24h) {
        console.error("24 hour analytics error:", error24h);
    } else {
        document.getElementById("visits-24h").textContent =
            visits24h || 0;
    }


    if (error7d) {
        console.error("7 day analytics error:", error7d);
    } else {
        document.getElementById("visits-7d").textContent =
            visits7d || 0;
    }


    if (error30d) {
        console.error("30 day analytics error:", error30d);
    } else {
        document.getElementById("visits-30d").textContent =
            visits30d || 0;
    }
const { count: unlockCount, error: unlockError } =
    await supabaseClient
        .from("unlock_events")
        .select("*", { count: "exact", head: true });

if (unlockError) {
    console.error("Unlock count error:", unlockError);
} else {
    console.log("Unlock count:", unlockCount);
    document.getElementById("total-unlocks").textContent =
        unlockCount || 0;
}
    }

document.getElementById("refresh-dashboard-button")
    .addEventListener("click", async function () {

        this.textContent = "⟳";

        await loadDashboardStats();

        this.textContent = "↻";
    });

loadDashboardStats();
</script>
